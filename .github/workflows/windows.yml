name: Windows tests and build

on:
  push:
    branches: [codex/desktop-app, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run tests and build Windows packages
        run: |
          $ciWork = Join-Path $env:RUNNER_TEMP 'hexguide-ci'
          "HEXGUIDE_CI_WORK=$ciWork" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & ./scripts/ci-windows.ps1 -NodePath (Get-Command node.exe).Source -WorkPath $ciWork
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HEXGUIDE_CI_WORK }}/artifacts/diagnostics/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload Windows installer and portable app
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HexGuide-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HEXGUIDE_CI_WORK }}/artifacts/packages/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
